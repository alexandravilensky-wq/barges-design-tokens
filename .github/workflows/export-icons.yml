name: Export icons

# Pull icons from the Figma DS-Foundation file and open a PR with the changes.
# Runs every night, so designers only publish the library in Figma. It can also be
# started any time from the Actions tab (Export icons → Run workflow).
# Needs the FIGMA_TOKEN repository secret (Figma access token, file read access).
on:
  schedule:
    - cron: '0 3 * * *' # every night at 03:00 UTC
  workflow_dispatch:
  # Optional: a Figma LIBRARY_PUBLISH webhook relay can trigger this with event type "figma-library-publish".
  repository_dispatch:
    types: [figma-library-publish]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: export-icons
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Export icons from Figma
        run: npm run export:icons
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          ICONS_SUMMARY: ${{ runner.temp }}/icons-summary.md
      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: icons/figma-export
          add-paths: icons/
          commit-message: Update icons from Figma
          title: Update icons from Figma
          body-path: ${{ runner.temp }}/icons-summary.md
          labels: icons
          delete-branch: true
